<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plixo — تجربة حيّة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* =========================================================================
     تجربة حيّة: شاشة دخول مزيّفة + جدار عرض للمقدّم (feed مباشر).
     - الصفحة الافتراضية = شاشة الدخول (للحضور على جوّالاتهم).
     - أضف #wall لنهاية الرابط = جدار المقدّم الذي يعرض الإدخالات لحظيًا.
     البيانات التجريبية تُرسل إلى Firebase (املأ الإعداد بالأسفل).
     ========================================================================= */
  :root{
    --bg:#eef1f6; --ink:#1b2130; --muted:#5b6475; --card:#fff; --line:#e4e8f0; --field:#f6f8fc;
    --brand1:#6d5cf0; --brand2:#c13aa6;
    --wall-bg:#120f1c; --wall-panel:#1d1930; --wall-line:#352f4e; --wall-ink:#f6f4ff; --wall-muted:#b8b2d6;
    --danger:#ff5a6a; --warn:#ffc24a; --safe:#53d6a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%}
  body{font-family:"IBM Plex Sans Arabic","Cairo",system-ui,sans-serif; background:var(--bg); color:var(--ink)}
  [hidden]{display:none!important}

  /* ---------- شاشة الدخول ---------- */
  .loginWrap{min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
  .box{width:100%; max-width:410px}
  .fakebar{display:flex; gap:7px; align-items:center; justify-content:center; width:fit-content; max-width:100%;
    margin:0 auto 18px; background:#eceff6; border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:12px; color:var(--muted)}
  .fakebar b{color:#c13a3a}
  .card{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:32px 26px 24px; box-shadow:0 24px 60px -30px rgba(27,33,48,.4)}
  .brand{display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:22px}
  .mark{width:64px; height:64px; border-radius:19px; display:grid; place-items:center;
    background:conic-gradient(from 210deg,#f0922e,var(--brand2),var(--brand1),#f0922e)}
  .mark svg{width:32px;height:32px}
  .brand h1{margin:0; font-family:"Cairo",sans-serif; font-weight:800; font-size:28px}
  .brand p{margin:0; font-size:13px; color:var(--muted)}
  form{display:flex; flex-direction:column; gap:12px}
  label{font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:5px}
  input{width:100%; font:inherit; font-size:15px; background:var(--field); border:1px solid var(--line);
    border-radius:12px; padding:13px 14px; outline:none; direction:ltr; text-align:left}
  input:focus{border-color:var(--brand1); background:#fff}
  .submit{margin-top:4px; border:0; border-radius:12px; cursor:pointer; color:#fff; padding:14px;
    font-family:"Cairo",sans-serif; font-weight:700; font-size:16px; background:linear-gradient(90deg,var(--brand1),var(--brand2))}
  .tag{margin-top:18px; text-align:center; font-size:11px; color:#9aa3b5}

  /* ---------- شاشة الكشف (بعد الإرسال) ---------- */
  .reveal{background:var(--wall-bg); color:var(--wall-ink); min-height:100vh;
    padding:30px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px))}
  .reveal .inner{max-width:430px; margin:0 auto}
  .reveal .boom{font-size:44px; text-align:center}
  .reveal h2{font-family:"Cairo",sans-serif; font-weight:800; font-size:25px; text-align:center; margin:10px 0 8px}
  .reveal .sub{font-size:14px; color:var(--wall-muted); text-align:center; line-height:1.7; margin:0 0 20px}
  .panel{background:var(--wall-panel); border:1px solid var(--wall-line); border-radius:16px; padding:18px; margin-bottom:16px}
  .panel .pl{color:var(--warn); font-weight:700; font-size:13.5px; margin-bottom:12px}
  .rowk{font-size:11.5px; color:var(--wall-muted); margin:10px 0 3px}
  .rowv{font-size:16px; font-weight:600; word-break:break-all; direction:ltr; text-align:right; font-family:ui-monospace,monospace}
  .rowv.empty{color:#6c6688; font-weight:400; direction:rtl}
  .note{font-size:13px; color:var(--wall-muted); line-height:1.75}
  .note b{color:var(--safe)}
  .again{width:100%; border:0; border-radius:12px; cursor:pointer; font-family:"Cairo",sans-serif; font-weight:700;
    font-size:15px; color:#120f1c; background:linear-gradient(90deg,var(--warn),#ffd77a); padding:13px; margin-top:6px}

  /* ---------- جدار المقدّم ---------- */
  .wall{min-height:100vh; background:var(--wall-bg); color:var(--wall-ink);
    padding:24px max(18px,env(safe-area-inset-right,0px)) 32px max(18px,env(safe-area-inset-left,0px))}
  .wall .head{max-width:1100px; margin:0 auto 20px; display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between}
  .wall .title{display:flex; align-items:center; gap:14px}
  .wall .title h2{font-family:"Cairo",sans-serif; font-weight:800; font-size:30px; margin:0}
  .wall .title .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 0 rgba(255,90,106,.6)}
  @media (prefers-reduced-motion:no-preference){ .wall .title .dot{animation:pulse 1.6s infinite} }
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,106,.6)}70%{box-shadow:0 0 0 14px rgba(255,90,106,0)}100%{box-shadow:0 0 0 0 rgba(255,90,106,0)}}
  .counter{display:flex; align-items:center; gap:12px}
  .counter .n{font-family:"Cairo",sans-serif; font-weight:900; font-size:40px; color:var(--danger); font-variant-numeric:tabular-nums}
  .counter .l{font-size:14px; color:var(--wall-muted)}
  .clear{border:1px solid var(--wall-line); background:var(--wall-panel); color:var(--wall-muted); font:inherit;
    font-size:13px; border-radius:10px; padding:9px 16px; cursor:pointer}
  .status{max-width:1100px; margin:0 auto 14px; font-size:13px; color:var(--wall-muted)}
  .status .warnbox{background:#2a1e12; border:1px solid #5a4322; color:var(--warn); border-radius:12px; padding:14px 18px; line-height:1.7}
  .grid{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .entry{background:var(--wall-panel); border:1px solid var(--wall-line); border-right:4px solid var(--danger); border-radius:14px; padding:16px 18px}
  .entry .t{font-size:11.5px; color:#8a84ac; margin-bottom:10px; direction:ltr; text-align:left}
  .entry .k{font-size:11px; color:var(--wall-muted); margin:8px 0 2px}
  .entry .v{font-size:16px; font-weight:600; word-break:break-all; direction:ltr; text-align:right; font-family:ui-monospace,monospace; color:#fff}
  .entry .v.empty{color:#6c6688;font-weight:400;direction:rtl}
  .empty-state{max-width:1100px;margin:60px auto;text-align:center;color:var(--wall-muted)}
  .empty-state .big{font-size:56px}
  .empty-state p{font-size:17px;line-height:1.7;margin:14px 0 0}
  .joinhint{display:inline-block;background:var(--wall-panel);border:1px solid var(--wall-line);border-radius:10px;
    padding:8px 16px;margin-top:10px;direction:ltr;font-family:ui-monospace,monospace;font-size:14px;color:#cfd8e6}
  @media (prefers-reduced-motion:no-preference){ .entry{animation:slidein .4s ease both} }
  @keyframes slidein{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- ===================== شاشة الدخول (الافتراضية) ===================== -->
<section id="loginView" class="loginWrap">
  <div class="box">
    <div class="fakebar">🔒 plixo-login.<b>verify-account.co</b></div>
    <div class="card">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="6"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff"/></svg></div>
        <h1>Plixo</h1>
        <p>سجّل الدخول لمتابعة أصدقائك</p>
      </div>
      <form id="loginForm" autocomplete="off" novalidate>
        <div><label for="user">البريد الإلكتروني أو اسم المستخدم</label>
        <input id="user" type="text" inputmode="email" placeholder="example@email.com" dir="ltr"></div>
        <div><label for="pass">كلمة المرور</label>
        <input id="pass" type="password" placeholder="••••••••" dir="ltr"></div>
        <button class="submit" type="submit">تسجيل الدخول</button>
      </form>
      <p class="tag">عرض تعليمي — استخدم بيانات وهميّة فقط</p>
    </div>
  </div>
</section>

<!-- ===================== شاشة الكشف للمتدرّب ===================== -->
<section id="revealView" class="reveal" hidden></section>

<!-- ===================== جدار المقدّم ===================== -->
<section id="wallView" class="wall" hidden>
  <div class="head">
    <div class="title"><span class="dot"></span><h2>ما يراه المهاجم — مباشر</h2></div>
    <div class="counter"><span class="n" id="count">0</span><span class="l">إدخال تمّ التقاطه</span>
      <button class="clear" id="clearBtn">مسح الكل</button></div>
  </div>
  <div class="status" id="status"></div>
  <div id="emptyState" class="empty-state">
    <div class="big">🎣</div>
    <p>بانتظار أول إدخال…<br>وجّه الحضور لمسح رمز QR أو فتح الرابط وإدخال بيانات وهميّة.</p>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- ============ إعداد Firebase ============ -->
<script type="module">
  // ▼▼▼ الصق إعدادات مشروع Firebase هنا (من إعدادات المشروع > Web App) ▼▼▼
  const firebaseConfig = {
  apiKey: "AIzaSyDvaRX198ARrW-rWjXn99h4p1U99walOUI",
  authDomain: "plixodemo.firebaseapp.com",
  databaseURL: "https://plixodemo-default-rtdb.firebaseio.com",
  projectId: "plixodemo",
  storageBucket: "plixodemo.firebasestorage.app",
  messagingSenderId: "144515826845",
  appId: "1:144515826845:web:da1c8b68dce2e6c60fc074"
};
  // ▲▲▲ لا تغيّر شيئًا آخر ▲▲▲

  const configured = !firebaseConfig.apiKey.startsWith("PASTE");
  let dbApi = null; // {push, subscribe, clear}

  // ----- أدوات واجهة -----
  const $ = (id) => document.getElementById(id);
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function cell(v, cls){ v=(v||'').trim();
    return v ? '<div class="'+cls+'">'+esc(v)+'</div>' : '<div class="'+cls+' empty">(فارغ)</div>'; }
  function fmtTime(ms){ const d=new Date(ms); const p=n=>String(n).padStart(2,'0');
    return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }

  // ----- ربط Firebase (اختياري) -----
  async function initFirebase(){
    if(!configured) return null;
    try{
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getDatabase, ref, push, onChildAdded, remove, query, limitToLast } =
        await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
      const app = initializeApp(firebaseConfig);
      const db  = getDatabase(app);
      const entriesRef = ref(db, "entries");
      return {
        push: (data) => push(entriesRef, data),
        subscribe: (onAdd) => onChildAdded(query(entriesRef, limitToLast(100)),
          (snap) => onAdd(snap.val())),
        clear: () => remove(entriesRef)
      };
    }catch(e){ console.error("Firebase init failed", e); return null; }
  }

  // ----- شاشة الدخول -----
  function renderReveal(u, p){
    $('revealView').innerHTML =
      '<div class="inner">'+
        '<div class="boom">🛑</div>'+
        '<h2>توقّف! هذه كانت صفحة مزيّفة</h2>'+
        '<p class="sub">لم تُسجّل دخولك إلى أي مكان. هذه نسخة مقلّدة تُظهر كيف يعمل التصيّد.</p>'+
        '<div class="panel"><div class="pl">لو كان هجومًا حقيقيًا، لحصل المهاجم على:</div>'+
          '<div class="rowk">البريد / اسم المستخدم</div>'+cell(u,'rowv')+
          '<div class="rowk">كلمة المرور</div>'+cell(p,'rowv')+
        '</div>'+
        '<p class="note">كتبتَ هذه البيانات بنفسك. '+
          (dbApi ? 'وقد ظهرت الآن على شاشة العرض أمام الجميع — تمامًا كما يراها المهاجم.' :
                   '<b>لم تُرسَل إلى أي مكان في هذا الوضع.</b>')+
          ' القاعدة: لا تُدخل كلمة مرورك في رابط لا تثق به.</p>'+
        '<button class="again" id="again">إعادة التجربة</button>'+
      '</div>';
    $('loginView').hidden = true;
    $('revealView').hidden = false;
    window.scrollTo(0,0);
    $('again').addEventListener('click', ()=>{
      $('user').value=''; $('pass').value='';
      $('revealView').hidden=true; $('revealView').innerHTML='';
      $('loginView').hidden=false; $('user').focus();
    });
  }

  function handleSubmit(e){
    e.preventDefault();
    const u=$('user').value, p=$('pass').value;
    if(dbApi){ dbApi.push({ u, p, t: Date.now() }).catch(err=>console.error(err)); }
    renderReveal(u, p);
  }

  // ----- جدار المقدّم -----
  let n=0;
  function addEntryCard(d){
    $('emptyState').hidden = true;
    n++; $('count').textContent = n;
    const el=document.createElement('div');
    el.className='entry';
    el.innerHTML = '<div class="t">'+fmtTime(d.t||Date.now())+'</div>'+
      '<div class="k">البريد / المستخدم</div>'+cell(d.u,'v')+
      '<div class="k">كلمة المرور</div>'+cell(d.p,'v');
    $('grid').prepend(el);
  }
  function setStatus(html){ $('status').innerHTML = html; }

  async function startWall(){
    $('loginView').hidden=true; $('wallView').hidden=false;
    if(!configured){
      setStatus('<div class="warnbox">لم يتم ربط قاعدة البيانات بعد. الصق إعدادات Firebase في أعلى ملف HTML لتظهر إدخالات الحضور هنا مباشرة. (يعمل الآن بوضع العرض فقط.)</div>');
      return;
    }
    if(!dbApi){ setStatus('<div class="warnbox">تعذّر الاتصال بقاعدة البيانات — تحقّق من الإعدادات والإنترنت.</div>'); return; }
    setStatus('');
    dbApi.subscribe(addEntryCard);
    $('clearBtn').addEventListener('click', ()=>{
      dbApi.clear().then(()=>{ $('grid').innerHTML=''; n=0; $('count').textContent='0'; $('emptyState').hidden=false; });
    });
  }

  // ----- الإقلاع -----
  (async ()=>{
    dbApi = await initFirebase();
    $('loginForm').addEventListener('submit', handleSubmit);
    const wall = location.hash.replace('#','') === 'wall';
    if(wall){ startWall(); }
    else { $('loginView').hidden=false; }
    window.addEventListener('hashchange', ()=>{ if(location.hash.replace('#','')==='wall') location.reload(); });
  })();
</script>
</body>
</html>
